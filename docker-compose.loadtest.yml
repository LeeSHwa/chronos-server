# 부하 테스트용 오버라이드. 평소 docker-compose.yml 위에 겹쳐서만 쓴다.
#
#   docker compose -f docker-compose.yml -f docker-compose.loadtest.yml up -d
#
# 이 파일을 지정하지 않으면(그냥 docker compose up -d) 아무 영향이 없다.
# 파일 이름을 docker-compose.override.yml 로 바꾸면 평소에도 자동 적용되니 바꾸지 말 것.
#
# 바꾸는 것은 세 가지다.
#   1) DB 볼륨을 테스트 전용(chronos-pgdata-loadtest)으로 바꾼다. 실제 로그 볼륨은 건드리지 않는다.
#   2) 컨테이너에 CPU·메모리 상한을 건다. 결과를 다시 재도 같은 조건이 되도록.
#   3) 실험할 서버 설정(커넥션 풀, 톰캣 스레드, 프로필)을 환경변수로 열어 둔다.
#
# 값은 실행 전에 PowerShell에서 바꾼다. 지정하지 않으면 오른쪽 기본값이 쓰인다.
#   $env:HIKARI_POOL_SIZE = "5"
# 절차와 단계별 값은 loadtest/README.md 참고.

services:
  postgres:
    volumes:
      # 같은 컨테이너 경로에 다른 볼륨을 붙이면 원본 설정의 볼륨을 대신한다.
      - pgdata-loadtest:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-2}"
          memory: ${DB_MEMORY:-2g}

  server:
    environment:
      # local 이면 부팅할 때 더미 로그 1만여 건을 넣는다. 부하 테스트 때는 비워 둔다.
      SPRING_PROFILES_ACTIVE: ${LOADTEST_PROFILE:-}
      # Spring Boot 기본값: 커넥션 풀 10, 톰캣 스레드 200
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${HIKARI_POOL_SIZE:-10}
      SERVER_TOMCAT_THREADS_MAX: ${TOMCAT_MAX_THREADS:-200}
      # DEBUG면 30초마다 "Pool stats (total, active, idle, waiting)" 이 서버 로그에 찍힌다.
      LOGGING_LEVEL_COM_ZAXXER_HIKARI: ${HIKARI_LOG_LEVEL:-DEBUG}
    deploy:
      resources:
        limits:
          cpus: "${SERVER_CPUS:-2}"
          memory: ${SERVER_MEMORY:-2g}

volumes:
  pgdata-loadtest:
    name: chronos-pgdata-loadtest
